<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>2D Web CAD (Vanilla ES6)</title>
		<style>
			:root { --border:#e5e7eb; --muted:#6b7280; --blue:#2563eb; --light-blue:#dbeafe; --green:#10b981; }
			html, body { height:100%; margin:0; }
			#app { display:flex; flex-direction:column; height:100%; }
			.toolbar { display:flex; gap:.5rem; align-items:center; padding:.5rem; border-bottom:1px solid var(--border); background:#fff; position:sticky; top:0; }
			.btn { font-size:14px; padding:.25rem .5rem; border:1px solid var(--border); border-radius:.5rem; background:#fff; cursor:pointer; }
			.btn.active { background:var(--blue); color:#fff; border-color:var(--blue); }
			.btn.primary { background:#111; color:#fff; border-color:#111; }
			.toolbar select, .toolbar input[type=number] { font-size:14px; padding:.2rem .35rem; border:1px solid var(--border); border-radius:.35rem; }
			.split { display:flex; height: calc(100% - 42px); position:relative; }
			.canvas-wrap { flex:1; position:relative; min-width:0; }
			.canvas { width:100%; height:100%; display:block; cursor:crosshair; }
			.overlay { position:absolute; left:150px; bottom:.5rem; font-size:12px; color:var(--muted); background:rgba(255,255,255,.85); padding:.25rem .5rem; border-radius:.25rem; box-shadow:0 1px 4px rgba(0,0,0,.06); }
			.sidebar { width:250px; min-width:180px; flex-shrink:0; border-left:1px solid var(--border); padding:.75rem; background:rgba(255,255,255,.95); overflow:auto; }
			.label { font-size:12px; color:var(--muted); }
			.hidden { display:none; }

			/* Tool Palette - Floating */
			.tool-palette { position:absolute; left:.5rem; top:.5rem; width:76px; background:rgba(255,255,255,.95); border:1px solid var(--border); border-radius:.5rem; padding:.5rem; box-shadow:0 2px 8px rgba(0,0,0,.08); z-index:10; max-height:calc(100% - 1rem); overflow-y:auto; }
			.tool-palette h3 { font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:0.5px; margin:.5rem 0 .25rem 0; padding:0 .25rem; }
			.tool-palette h3:first-child { margin-top:0; }
			.tool-btn { display:inline-flex; align-items:center; justify-content:center; width:32px; height:32px; padding:4px; margin:2px; border:1px solid transparent; border-radius:.35rem; background:transparent; cursor:pointer; vertical-align:top; }
			.tool-btn:hover { background:#f0f0f0; }
			.tool-btn.active { background:var(--light-blue); border-color:#93c5fd; }
			.tool-icon { width:20px; height:20px; opacity:0.8; }
			.tool-btn:hover .tool-icon { opacity:1; }
			.tool-btn.active .tool-icon { opacity:1; filter:brightness(0) saturate(100%) invert(18%) sepia(89%) saturate(1557%) hue-rotate(212deg) brightness(96%) contrast(92%); }

			/* Inspector Panel */
			.inspector-empty { color:var(--muted); font-size:13px; padding:1rem; text-align:center; }
			.inspector-panel { font-size:13px; }
			.inspector-header { font-weight:600; padding:.5rem .5rem .25rem; border-bottom:1px solid var(--border); margin-bottom:.5rem; }
			.inspector-section { margin-bottom:.75rem; }
			.inspector-section-title { font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:0.5px; padding:0 .5rem .25rem; }
			.inspector-row { display:flex; align-items:center; padding:.2rem .5rem; gap:.5rem; }
			.inspector-row label { flex:0 0 70px; color:var(--muted); font-size:12px; }
			.inspector-row input, .inspector-row select { flex:1; font-size:12px; padding:.25rem .4rem; border:1px solid var(--border); border-radius:.25rem; min-width:0; }
			.inspector-row input:focus, .inspector-row select:focus { outline:none; border-color:var(--blue); }
			.inspector-row input[type="number"] { -moz-appearance:textfield; }
			.inspector-row input[type="number"]::-webkit-inner-spin-button { -webkit-appearance:none; }
			.inspector-value { flex:1; font-size:12px; color:#333; }
			.inspector-button-row { justify-content:stretch; }
			.inspector-button { flex:1; padding:.4rem .75rem; font-size:12px; background:var(--blue); color:white; border:none; border-radius:.25rem; cursor:pointer; }
			.inspector-button:hover { background:#1d4ed8; }
			.inspector-btn-group { display:flex; flex:1; border:1px solid var(--border); border-radius:.25rem; overflow:hidden; }
			.inspector-btn-group-btn { flex:1; padding:.3rem .5rem; font-size:11px; background:#fff; border:none; border-right:1px solid var(--border); cursor:pointer; }
			.inspector-btn-group-btn:last-child { border-right:none; }
			.inspector-btn-group-btn:hover { background:#f0f0f0; }
			.inspector-btn-group-btn.selected { background:var(--blue); color:white; }

			/* Palette Panel */
			#palette-panel { margin-top:1rem; border-top:1px solid var(--border); padding-top:.75rem; }
			#palette-panel .panel-header { display:flex; align-items:center; justify-content:space-between; padding:0 .5rem .5rem; }
			#palette-panel .panel-header span { font-weight:600; font-size:13px; }
			#palette-panel .btn-small { width:24px; height:24px; padding:0; font-size:16px; line-height:1; border:1px solid var(--border); border-radius:.25rem; background:#fff; cursor:pointer; }
			#palette-panel .btn-small:hover { background:#f0f0f0; }
			.palette-swatches { display:flex; flex-direction:column; gap:.35rem; }
			.palette-swatch { display:flex; align-items:center; gap:.35rem; padding:0 .5rem; }
			.palette-swatch .swatch-color { width:28px; height:24px; padding:0; border:1px solid var(--border); border-radius:.25rem; cursor:pointer; }
			.palette-swatch .swatch-name { flex:1; font-size:12px; padding:.25rem .4rem; border:1px solid var(--border); border-radius:.25rem; min-width:0; }
			.palette-swatch .swatch-delete { width:20px; height:20px; padding:0; font-size:14px; line-height:1; border:none; background:transparent; color:var(--muted); cursor:pointer; }
			.palette-swatch .swatch-delete:hover { color:#dc2626; }

			/* Responsive: collapse inspector on small screens */
			@media (max-width: 700px) {
				.sidebar { width:180px; min-width:120px; padding:.5rem; }
				.inspector-row label { flex:0 0 50px; }
			}
			@media (max-width: 500px) {
				.sidebar { display:none; }
				.tool-btn { width:28px; height:28px; }
				.tool-icon { width:16px; height:16px; }
			}

			.canvas-default {cursor: crosshair;}

			.canvas-line {cursor: url("cursors/line.png") 16 16, crosshair;}
			
			.canvas-trim {cursor: url("cursors/trim.png") 16 16, crosshair;}
			
			.canvas-fillet {cursor: url("assets/cursors/fillet.png") 16 16, crosshair;}
			
		</style>
	</head>
	<body>
		<div id="app">
			<div class="toolbar" id="toolbar">
				<button class="btn" id="btnNew" title="New (Ctrl+N)">New</button>
				<button class="btn" id="btnOpen" title="Open (Ctrl+O)">Open</button>
				<button class="btn" id="btnSave" title="Save (Ctrl+S)">Save</button>
				<button class="btn" id="btnImportSVG" title="Import SVG">Import SVG</button>
				<button class="btn" id="btnExportSVG" title="Export SVG">Export SVG</button>
				<button class="btn" id="btnExportGcode" title="Export Gcode for plotter">Export Gcode</button>
				<button class="btn" id="btnExportDXF" title="Export DXF for CAD">Export DXF</button>
				<span style="margin-left: .5rem; border-left:1px solid var(--border); height:20px;"></span>
				<input id="toolbarTextInput" type="text" placeholder="Type here…" style="margin-left: .5rem;" />
				<span id="currentToolName" class="label" style="margin-left: 1rem;"></span>
				<span style="flex:1;"></span>
				<label class="label" style="margin-right: .25rem;">Units:</label>
				<select id="unitSelector">
					<option value="mm">mm</option>
					<option value="cm">cm</option>
					<option value="m">m</option>
					<option value="in">in</option>
					<option value="ft">ft</option>
					<option value="ft-in">ft-in</option>
				</select>
			</div>
			<div class="split">
				<div class="canvas-wrap">
					<canvas id="stage" class="canvas"></canvas>
					<nav class="tool-palette" id="toolPalette">
						<!-- Tools will be populated by ToolManager -->
					</nav>
					<div class="overlay" id="overlay">
						<span id="coordDisplay" style="margin-right: 1rem; font-family: monospace;"></span>
						<span>Wheel=Zoom · Space=Pan · ⌫=Delete · Cmd+F=Fit · Cmd+Shift+F=Fit Selection</span>
					</div>
				</div>
				<aside class="sidebar">
					<div id="inspector"></div>
					<div id="palette-panel"></div>
				</aside>
			</div>
		</div>
		<script type="module" src="./src/main.js"></script>
	</body>
</html>
