<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>2D Web CAD (Vanilla ES6)</title>
		<style>
			:root { --border:#e5e7eb; --muted:#6b7280; --blue:#2563eb; --light-blue:#dbeafe; --green:#10b981; }
			html, body { height:100%; margin:0; }
			#app { display:flex; flex-direction:column; height:100%; }
			.toolbar { display:flex; gap:.5rem; align-items:center; padding:.5rem; border-bottom:1px solid var(--border); background:#fff; position:sticky; top:0; }
			.btn { font-size:14px; padding:.25rem .5rem; border:1px solid var(--border); border-radius:.5rem; background:#fff; cursor:pointer; }
			.btn.active { background:var(--blue); color:#fff; border-color:var(--blue); }
			.btn.primary { background:#111; color:#fff; border-color:#111; }
			.toolbar select, .toolbar input[type=number] { font-size:14px; padding:.2rem .35rem; border:1px solid var(--border); border-radius:.35rem; }
			.split { display:grid; grid-template-columns: 140px 1fr 300px; height: calc(100% - 42px); }
			.canvas-wrap { position:relative; }
			.canvas { width:100%; height:100%; display:block; cursor:crosshair; }
			.overlay { position:absolute; left:.5rem; bottom:.5rem; font-size:12px; color:var(--muted); background:rgba(255,255,255,.85); padding:.25rem .5rem; border-radius:.25rem; box-shadow:0 1px 4px rgba(0,0,0,.06); }
			.sidebar { border-left:1px solid var(--border); padding:.75rem; background:rgba(255,255,255,.6); overflow:auto; }
			.label { font-size:12px; color:var(--muted); }
			.hidden { display:none; }

			/* Tool Palette */
			.tool-palette { border-right:1px solid var(--border); background:#fafafa; padding:.5rem; overflow-y:auto; }
			.tool-palette h3 { font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:0.5px; margin:0 0 .5rem 0; padding:0 .25rem; }
			.tool-btn { display:block; width:100%; text-align:left; font-size:13px; padding:.4rem .5rem; margin-bottom:2px; border:1px solid transparent; border-radius:.35rem; background:transparent; cursor:pointer; color:#333; }
			.tool-btn:hover { background:#f0f0f0; }
			.tool-btn.active { background:var(--light-blue); border-color:#93c5fd; color:#1e40af; }
			.tool-btn .shortcut { float:right; color:var(--muted); font-size:11px; }
		</style>
	</head>
	<body>
		<div id="app">
			<div class="toolbar" id="toolbar">
				<input id="toolbarTextInput" type="text" placeholder="Type here…" />
				<span id="currentToolName" class="label" style="margin-left: 1rem;"></span>
			</div>
			<div class="split">
				<nav class="tool-palette" id="toolPalette">
					<!-- Tools will be populated by ToolManager -->
				</nav>
				<div class="canvas-wrap">
					<canvas id="stage" class="canvas"></canvas>
					<div class="overlay" id="overlay">Wheel=Zoom · Space/Middle/Right=Pan · ⌫=Delete · ⌘A=Select All</div>
				</div>
				<aside class="sidebar" id="inspector"></aside>
			</div>
		</div>
		<script type="module" src="./src/main.js"></script>
	</body>
</html>
