<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Layout</title>
		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500&display=swap" rel="stylesheet">
		<style>
			:root { --border:#e5e7eb; --muted:#6b7280; --blue:#2563eb; --light-blue:#dbeafe; --green:#10b981; }
			html, body { height:100%; margin:0; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
			#app { display:flex; flex-direction:column; height:100%; }
			.hidden { display:none !important; }

			/* ---- Menu Bar ---- */
			.menubar { display:flex; align-items:center; height:50px; padding:0 1rem; background:#fff; border-bottom:1px solid var(--border); flex-shrink:0; }
			.menubar-logo { font-family:'Outfit', sans-serif; font-weight:500; font-size:28px; color:#111; margin-right:2rem; line-height:1; user-select:none; }
			.menubar-items { display:flex; align-items:center; gap:0; }
			.menu-trigger { position:relative; padding:.35rem .75rem; font-size:14px; color:#333; background:none; border:none; cursor:pointer; border-radius:.35rem; }
			.menu-trigger:hover, .menu-trigger.open { background:#f0f0f0; }
			.menu-dropdown { display:none; position:absolute; top:100%; left:0; min-width:200px; width:max-content; background:#fff; border:1px solid var(--border); border-radius:.5rem; box-shadow:0 4px 16px rgba(0,0,0,.12); padding:.25rem 0; z-index:100; margin-top:.25rem; }
			.menu-trigger.open .menu-dropdown { display:block; }
			.menu-item { display:flex; align-items:center; justify-content:space-between; padding:.5rem .75rem; font-size:13px; color:#333; background:none; border:none; cursor:pointer; text-align:left; white-space:nowrap; }
			.menu-item:hover { background:#f5f5f5; }
			.menu-item .shortcut { color:var(--muted); font-size:12px; margin-left:2rem; }
			.menu-separator { height:1px; background:var(--border); margin:.25rem 0; }

			/* ---- Layout ---- */
			.split { display:flex; flex:1; position:relative; min-height:0; }
			.canvas-wrap { flex:1; position:relative; min-width:0; }
			.canvas { width:100%; height:100%; display:block; cursor:crosshair; }
			.sidebar { width:250px; min-width:180px; flex-shrink:0; border-left:1px solid var(--border); padding:.75rem; background:rgba(255,255,255,.95); overflow:auto; }
			.label { font-size:12px; color:var(--muted); }

			/* ---- Bottom Input Bar ---- */
			.input-bar { position:absolute; bottom:0; left:0; right:0; height:50px; background:#fff; border-top:1px solid var(--border); display:flex; align-items:center; padding:0 1.5rem; gap:1rem; z-index:10; }
			.input-bar-label { font-size:16px; color:#111; white-space:nowrap; min-width:120px; }
			.input-bar .icon-input { width:180px; margin-bottom:0; }

			/* ---- Tool Palette - Floating ---- */
			.tool-palette { position:absolute; left:.5rem; top:.5rem; width:76px; background:rgba(255,255,255,.95); border:1px solid var(--border); border-radius:.5rem; padding:.5rem; box-shadow:0 2px 8px rgba(0,0,0,.08); z-index:10; max-height:calc(100% - 1rem); overflow-y:auto; }
			.tool-palette h3 { font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size:11px; font-weight:600; color:var(--muted); text-transform:uppercase; letter-spacing:0.5px; margin:.5rem 0 .25rem 0; padding:0 .25rem; }
			.tool-palette h3:first-child { margin-top:0; }
			.tool-btn { display:inline-flex; align-items:center; justify-content:center; width:32px; height:32px; padding:4px; margin:2px; border:1px solid transparent; border-radius:.35rem; background:transparent; cursor:pointer; vertical-align:top; }
			.tool-btn:hover { background:#f0f0f0; }
			.tool-btn.active { background:var(--light-blue); border-color:#93c5fd; }
			.tool-icon { width:20px; height:20px; opacity:0.8; }
			.tool-btn:hover .tool-icon { opacity:1; }
			.tool-btn.active .tool-icon { opacity:1; filter:brightness(0) saturate(100%) invert(18%) sepia(89%) saturate(1557%) hue-rotate(212deg) brightness(96%) contrast(92%); }

			/* ---- Inspector Panel ---- */
			.inspector-panel { font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size:13px; padding:0 8px; }
			.inspector-header { font-size:16px; font-weight:600; margin-bottom:16px; padding-bottom:12px; border-bottom:1px solid var(--border); }
			.inspector-section { margin-bottom:16px; }
			.inspector-section-title { font-size:11px; font-weight:600; color:var(--muted); text-transform:uppercase; letter-spacing:0.5px; margin-bottom:8px; }

			/* Icon Input */
			.icon-input { display:flex; align-items:center; height:32px; background:#f5f5f5; border:none; border-radius:6px; padding:0 8px; margin-bottom:8px; }
			.icon-input:last-child { margin-bottom:0; }
			.icon-input::before { content:''; width:16px; height:16px; margin-right:6px; flex-shrink:0; background-image:var(--icon); background-size:contain; background-repeat:no-repeat; background-position:center; opacity:0.5; }
			.icon-input:not([style*="--icon"])::before { display:none; }
			.icon-input input { flex:1; border:none; background:transparent; font-size:13px; color:#333; outline:none; width:100%; min-width:0; }
			.icon-input input::-webkit-inner-spin-button { -webkit-appearance:none; }
			.icon-input input { -moz-appearance:textfield; }

			/* Plain Select (no icon) */
			.plain-select { position:relative; display:flex; align-items:center; height:32px; background:#f5f5f5; border:none; border-radius:6px; padding:0 8px; cursor:pointer; margin-bottom:8px; }
			.plain-select:last-child { margin-bottom:0; }
			.plain-select select { flex:1; border:none; background:transparent; font-size:13px; color:#333; cursor:pointer; appearance:none; outline:none; padding-right:20px; }
			.plain-select .chevron { position:absolute; right:8px; width:12px; height:12px; color:var(--muted); pointer-events:none; }

			/* Icon Select (with optional icon) */
			.icon-select { position:relative; display:flex; align-items:center; height:32px; background:#f5f5f5; border:none; border-radius:6px; padding:0 8px; cursor:pointer; margin-bottom:8px; }
			.icon-select:last-child { margin-bottom:0; }
			.icon-select::before { content:''; width:16px; height:16px; margin-right:8px; flex-shrink:0; background-image:var(--icon); background-size:contain; background-repeat:no-repeat; background-position:center; opacity:0.5; }
			.icon-select:not([style*="--icon"])::before { display:none; }
			.icon-select select { flex:1; border:none; background:transparent; font-size:13px; color:#333; cursor:pointer; appearance:none; outline:none; padding-right:20px; }
			.icon-select .chevron { position:absolute; right:8px; width:12px; height:12px; color:var(--muted); pointer-events:none; }

			/* Input Row (two inputs side by side) */
			.input-row { display:flex; gap:8px; margin-bottom:8px; }
			.input-row:last-child { margin-bottom:0; }
			.input-row .icon-input { flex:1; margin-bottom:0; }
			.input-row .plain-select { flex:1; margin-bottom:0; }
			.input-row .icon-select { flex:1; margin-bottom:0; }

			/* Action Button */
			.action-btn { display:flex; align-items:center; justify-content:center; width:100%; height:36px; background:#8b5cf6; color:white; border:none; border-radius:6px; font-size:13px; font-weight:500; cursor:pointer; transition:background 0.15s; margin-bottom:8px; }
			.action-btn:last-child { margin-bottom:0; }
			.action-btn:hover { background:#7c3aed; }

			/* Stats List (read-only values) */
			.stats-list { display:flex; flex-direction:column; gap:4px; }
			.stat-row { display:flex; justify-content:space-between; align-items:center; font-size:12px; padding:0px 0px 6px 0px; }
			.stat-row .stat-label { color:var(--muted); }
			.stat-row .stat-value { color:#333; }

			/* Color Swatches */
			.color-swatches { display:flex; gap:6px; margin-bottom:8px; }
			.color-swatch { width:24px; height:24px; border-radius:4px; border:none; cursor:pointer; transition:transform 0.1s; }
			.color-swatch:hover { transform:scale(1.1); }
			.color-swatch.active { outline:2px solid var(--blue); outline-offset:2px; }

			/* Segment Group */
			.segment-group { display:inline-flex; border-radius:6px; gap:2px; margin-bottom:8px; }
			.segment-group:last-child { margin-bottom:0; }
			.segment-btn { display:flex; align-items:center; justify-content:center; width:36px; height:32px; background:#f0f0f0; border:none; border-radius:4px; cursor:pointer; padding:0; color:#333; transition:background 0.15s; }
			.segment-btn:hover { background:#e8e8e8; }
			.segment-btn.active { background:#e0e0e0; }
			.segment-btn::before { content:''; width:16px; height:16px; background-image:var(--icon); background-size:contain; background-repeat:no-repeat; background-position:center; }

			/* Legacy support */
			.inspector-row { display:flex; align-items:center; padding:.2rem 0; gap:.5rem; }
			.inspector-row label { flex:0 0 70px; color:var(--muted); font-size:12px; }
			.inspector-value { font-size:12px; color:#333; }
			.inspector-checkbox-row label { display:flex; align-items:center; gap:6px; flex:1; color:#333; font-size:13px; cursor:pointer; }
			.inspector-checkbox-row input[type="checkbox"] { width:16px; height:16px; cursor:pointer; }
			.reset-btn { flex:0 0 auto; width:20px; height:20px; padding:0; font-size:14px; line-height:1; border:1px solid var(--border); border-radius:4px; background:#fff; cursor:pointer; color:var(--muted); }
			.reset-btn:hover { background:#f0f0f0; color:#333; }
			.mb-8 { margin-bottom:8px; }
			.mb-12 { margin-bottom:12px; }
			.mb-16 { margin-bottom:16px; }

			/* Palette Panel */
			#palette-panel { margin-top:1rem; border-top:1px solid var(--border); padding-top:.75rem; }
			#palette-panel .panel-header { display:flex; align-items:center; justify-content:space-between; padding:0 .5rem .5rem; }
			#palette-panel .panel-header span { font-weight:600; font-size:13px; }
			#palette-panel .btn-small { width:24px; height:24px; padding:0; font-size:16px; line-height:1; border:1px solid var(--border); border-radius:.25rem; background:#fff; cursor:pointer; }
			#palette-panel .btn-small:hover { background:#f0f0f0; }
			.palette-swatches { display:flex; flex-direction:column; gap:.35rem; }
			.palette-swatch { display:flex; align-items:center; gap:.35rem; padding:0 .5rem; }
			.palette-swatch .swatch-color { width:28px; height:24px; padding:0; border:1px solid var(--border); border-radius:.25rem; cursor:pointer; }
			.palette-swatch .swatch-name { flex:1; font-size:12px; padding:.25rem .4rem; border:1px solid var(--border); border-radius:.25rem; min-width:0; }
			.palette-swatch .swatch-delete { width:20px; height:20px; padding:0; font-size:14px; line-height:1; border:none; background:transparent; color:var(--muted); cursor:pointer; }
			.palette-swatch .swatch-delete:hover { color:#dc2626; }

			/* Responsive */
			@media (max-width: 700px) {
				.sidebar { width:180px; min-width:120px; padding:.5rem; }
				.inspector-row label { flex:0 0 50px; }
			}
			@media (max-width: 500px) {
				.sidebar { display:none; }
				.tool-btn { width:28px; height:28px; }
				.tool-icon { width:16px; height:16px; }
			}

			.canvas-default {cursor: crosshair;}
			.canvas-line {cursor: url("cursors/line.png") 16 16, crosshair;}
			.canvas-trim {cursor: url("cursors/trim.png") 16 16, crosshair;}
			.canvas-fillet {cursor: url("assets/cursors/fillet.png") 16 16, crosshair;}

			/* Confirm Dialog */
			.dialog-overlay { position:fixed; inset:0; background:rgba(0,0,0,.35); display:flex; align-items:center; justify-content:center; z-index:9999; }
			.dialog { background:#fff; border-radius:.5rem; padding:1.5rem; min-width:320px; max-width:400px; box-shadow:0 8px 32px rgba(0,0,0,.18); font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
			.dialog p { margin:0 0 1.25rem 0; font-size:14px; line-height:1.5; color:#111; }
			.dialog-buttons { display:flex; justify-content:flex-end; gap:.5rem; }
			.dialog-buttons .btn-cancel { padding:.35rem .75rem; font-size:13px; border:1px solid var(--border); border-radius:.35rem; background:#fff; cursor:pointer; }
			.dialog-buttons .btn-danger { padding:.35rem .75rem; font-size:13px; border:1px solid #dc2626; border-radius:.35rem; background:#dc2626; color:#fff; cursor:pointer; }

		</style>
	</head>
	<body>
		<div id="app">
			<!-- Menu Bar -->
			<div class="menubar">
				<span class="menubar-logo">layout</span>
				<div class="menubar-items">
					<div class="menu-trigger" id="menuFile">File
						<div class="menu-dropdown">
							<div class="menu-item" id="menuNew">New<span class="shortcut">&#8984;N</span></div>
							<div class="menu-item" id="menuOpen">Open<span class="shortcut">&#8984;O</span></div>
							<div class="menu-item" id="menuSave">Save<span class="shortcut">&#8984;S</span></div>
							<div class="menu-separator"></div>
							<div class="menu-item" id="menuImportSVG">Import SVG</div>
							<div class="menu-separator"></div>
							<div class="menu-item" id="menuExportSVG">Export SVG</div>
							<div class="menu-item" id="menuExportGcode">Export Gcode</div>
							<div class="menu-item" id="menuExportDXF">Export DXF</div>
						</div>
					</div>
					<div class="menu-trigger" id="menuAbout">About
						<div class="menu-dropdown">
							<div class="menu-item" id="menuAboutApp">About Layout</div>
						</div>
					</div>
				</div>
			</div>

			<!-- Main Content -->
			<div class="split">
				<div class="canvas-wrap">
					<canvas id="stage" class="canvas"></canvas>
					<nav class="tool-palette" id="toolPalette">
						<!-- Tools will be populated by ToolManager -->
					</nav>
					<!-- Bottom Input Bar -->
					<div class="input-bar" id="inputBar">
						<span class="input-bar-label" id="inputLabel"></span>
						<div class="icon-input hidden" id="inputIconWrap">
							<input type="text" id="toolbarTextInput" />
						</div>
						<div class="icon-input hidden" id="inputIconWrap2">
							<input type="text" id="toolbarTextInput2" />
						</div>
					</div>
				</div>
				<aside class="sidebar">
					<div id="inspector"></div>
					<div id="palette-panel"></div>
				</aside>
			</div>
		</div>
		<div id="confirmDialog" class="dialog-overlay hidden">
			<div class="dialog">
				<p id="confirmDialogMessage"></p>
				<div class="dialog-buttons">
					<button class="btn-cancel" id="confirmDialogCancel">Cancel</button>
					<button class="btn-danger" id="confirmDialogConfirm">Don&#x2019;t Save</button>
				</div>
			</div>
		</div>
		<script src="https://cdn.jsdelivr.net/npm/opentype.js@1.3.4/dist/opentype.min.js"></script>
		<script type="module" src="./src/main.js"></script>
	</body>
</html>
